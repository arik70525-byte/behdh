name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip project
      run: |
        unzip scanner_app.zip -d .
        
    - name: Fix Theme
      run: |
        sed -i 's/@style\/Theme.AppCompat.Light.DarkActionBar/@android:style\/Theme.Material.Light.DarkActionBar/g' AndroidManifest.xml
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
