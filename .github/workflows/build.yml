name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip project
      run: |
        ARCHIVE=$(find . -name "*.zip" | head -n 1)
        unzip -o "$ARCHIVE" -d .
        
    - name: Clean old build caches
      run: |
        rm -rf app/build
        rm -rf build
        rm -rf .gradle
        
    - name: Fix Theme and Styles
      run: |
        # Ищем манифест и жестко меняем тему
        MANIFEST=$(find . -name "AndroidManifest.xml" | head -n 1)
        echo "Правим манифест: $MANIFEST"
        sed -i 's/@style\/Theme.AppCompat.Light.DarkActionBar/@android:style\/Theme.Material.Light.DarkActionBar/g' "$MANIFEST"
        
        # Удаляем файл styles.xml, если он есть, чтобы он не конфликтовал
        STYLES=$(find . -name "styles.xml" | head -n 1)
        if [ -n "$STYLES" ]; then
           echo "Удаляем $STYLES"
           rm "$STYLES"
        fi
        
    - name: Grant execute permission for gradlew
      run: |
        GRADLEW=$(find . -name "gradlew" | head -n 1)
        chmod +x "$GRADLEW"
        
    - name: Build with Gradle
      run: |
        GRADLEW=$(find . -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW")
        ./gradlew clean assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
