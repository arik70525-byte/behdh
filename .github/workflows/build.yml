name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip project
      run: |
        ARCHIVE=$(find . -name "*.zip" | head -n 1)
        unzip -o "$ARCHIVE" -d .
        
    - name: Clean old build caches
      run: |
        echo "Удаляем старые кэши сборки..."
        rm -rf app/build
        rm -rf build
        rm -rf .gradle
        
    - name: Grant execute permission for gradlew
      run: |
        GRADLEW=$(find . -name "gradlew" | head -n 1)
        chmod +x "$GRADLEW"
        
    - name: Build with Gradle
      run: |
        GRADLEW=$(find . -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW")
        ./gradlew clean assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
